<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181818" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />
    <script>
      try {
        const theme = localStorage.getItem("cifraclub-helper-theme");
        document.documentElement.dataset.theme =
          theme === "light" ? "light" : "dark";
        document.documentElement.style.colorScheme =
          document.documentElement.dataset.theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta
      name="description"
      content="Editor visual de cifras e tablaturas. Organize suas músicas e exporte texto para o Cifra Club."
    />
    <title>Cifra Club Helper — Editor de cifras</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
